# The fork's own self-checks, which need no browser, game files or emsdk and take seconds. One list, run by
# vn-ci.yml on every pull request and push to master and by vn-release.yml before it builds.
name: VN self-checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Catches regressions in lazyfs.js ranged reads, frida-compat.js string/pattern/trans code,
  # vnbox-movie.js command order and decoder lifetime,
  # boxedwine-shell.js (URL options, CUE/BIN, zips), source/io/readahead.h, and VNBox options read in
  # code but missing from vnbox-options.json (or listed but read nowhere), the audio worklet's buffering
  # and clock (boxedwine-audio-worklet.js), the page's mouse button handling (knativeinputSDL.cpp) and the main loop's wake and frame wait (mainloop.cpp).
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      # No npm dependencies to cache: the checks use only Node's standard library.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: lazyfs.check.mjs
        run: node project/emscripten/lazyfs.check.mjs

      - name: frida-compat.check.mjs
        run: node project/emscripten/frida-compat.check.mjs

      - name: vnbox-movie.check.mjs
        run: node project/emscripten/vnbox-movie.check.mjs

      - name: vnbox-options.check.mjs
        run: node project/emscripten/vnbox-options.check.mjs

      - name: boxedwine-shell.test.cjs
        run: node --test project/emscripten/boxedwine-shell.test.cjs

      - name: testAudioWorklet.mjs
        run: node --test project/emscripten/testAudioWorklet.mjs

      - name: testBrowserMouseButtons.mjs
        run: node --test project/emscripten/testBrowserMouseButtons.mjs

      - name: testMainLoopWake.mjs
        run: node --test project/emscripten/testMainLoopWake.mjs

      - name: test_read_ahead.cpp
        run: |
          g++ -std=c++17 -I source/io tools/test_read_ahead.cpp -o "$RUNNER_TEMP/test_read_ahead"
          "$RUNNER_TEMP/test_read_ahead"
