# VNBox checks on every pull request and push to master: the fork's own self-checks (vn-checks.yml) and the
# testJit suite.
name: VN CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: vn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Catches a regression in any self-check listed in vn-checks.yml.
  checks:
    uses: ./.github/workflows/vn-checks.yml

  # Catches CPU emulation and WASM JIT regressions (the source/test suite: CPU/MMX/SSE/x87 ops, JIT
  # chaining, hard links, ...) by building `make testJit` and running it under Node. -fast runs every test
  # but fewer register/addressing combinations (~3 min instead of ~12).
  testjit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EMSDK_VERSION: 5.0.7 # same as vn-release.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # emsdk plus its cache of compiled system libraries, so only the first run pays for them.
      - id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-testjit-${{ runner.os }}

      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build testJit
        run: |
          source ~/emsdk/emsdk_env.sh
          make -C project/emscripten testJit make_jobs="$(nproc)"

      - name: Run testJit
        run: project/emscripten/run-testjit-node.sh -fast
